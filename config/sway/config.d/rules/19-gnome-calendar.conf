# ==== GNOME CALENDAR WINDOW RULES ====
# Floating window with border, centered 800x600

for_window [app_id="org.gnome.Calendar"] border enable
for_window [app_id="org.gnome.Calendar"] floating enable
for_window [app_id="org.gnome.Calendar"] resize set 1000 800
for_window [app_id="org.gnome.Calendar"] move position center
