---
- name: Restart the gpg-agent
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ target_user }} --
      env HOME={{ target_user_home }}
      GNUPGHOME={{ target_user_home }}/.gnupg
      XDG_RUNTIME_DIR=/run/user/{{ target_user_uid }}
      gpgconf --kill gpg-agent
  changed_when: true
