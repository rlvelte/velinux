---
- name: Assert target user facts are available
  ansible.builtin.assert:
    that:
      - target_user is defined
      - target_user_home is defined
      - target_user_uid is defined
      - target_user_gid is defined

- name: Add user repositories
  community.general.zypper_repository:
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    repo: "{{ item.repo }}"
    state: present
    autorefresh: true
    auto_import_keys: true
  loop: "{{ velinux_user_repositories }}"

- name: Install user dependencies
  ansible.builtin.package:
    name: "{{ velinux_user_dependencies }}"
    state: present
  when: velinux_user_dependencies | length > 0

- name: Install user packages
  ansible.builtin.package:
    name: "{{ velinux_user_packages }}"
    state: present
  when: velinux_user_packages | length > 0

- name: Enable and start user audio services
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service
  become: true
  become_user: "{{ target_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid }}"

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config"
    state: directory
    owner: "{{ target_user_uid }}"
    group: "{{ target_user_gid }}"
    mode: "0755"

- name: Configure Zsh
  ansible.builtin.include_tasks: zsh.yml

- name: Configure Bash
  ansible.builtin.include_tasks: bash.yml

- name: Configure Pwsh
  ansible.builtin.include_tasks: pwsh.yml

- name: Configure Fonts
  ansible.builtin.include_tasks: fonts.yml

- name: Configure GnuPG
  ansible.builtin.include_tasks: gpg.yml

- name: Configure Git
  ansible.builtin.include_tasks: git.yml

- name: Configure Sway
  ansible.builtin.include_tasks: sway.yml

- name: Configure Noctalia
  ansible.builtin.include_tasks: noctalia.yml

- name: Reload the user systemd manager
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  become: true
  become_user: "{{ target_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid }}"
