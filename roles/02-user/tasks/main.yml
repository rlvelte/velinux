---
- name: Assert target user facts are available
  ansible.builtin.assert:
    that:
      - target_user is defined
      - target_user_home is defined
      - target_user_uid is defined
      - target_user_gid is defined

- name: Add user repositories
  community.general.zypper_repository:
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    repo: "{{ item.repo }}"
    state: present
    autorefresh: true
    auto_import_keys: true
  loop: "{{ velinux_user_repositories }}"

- name: Install user dependencies
  ansible.builtin.package:
    name: "{{ velinux_user_dependencies }}"
    state: present
  when: velinux_user_dependencies | length > 0

- name: Install user packages
  ansible.builtin.package:
    name: "{{ velinux_user_packages }}"
    state: present
  when: velinux_user_packages | length > 0

- name: Check whether lingering is enabled for the target user
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ target_user }}"
  register: linger_file

- name: Enable lingering for the target user
  ansible.builtin.command: "loginctl enable-linger {{ target_user }}"
  when: not linger_file.stat.exists
  changed_when: true

- name: Wait for the user manager of the target user
  ansible.builtin.wait_for:
    path: "/run/user/{{ target_user_uid }}/systemd/private"
    state: present
    timeout: 30

- name: Enable and start user audio services
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ target_user }} --
      env XDG_RUNTIME_DIR=/run/user/{{ target_user_uid }}
      systemctl --user enable --now {{ item }}
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service
  changed_when: true

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config"
    state: directory
    owner: "{{ target_user_uid }}"
    group: "{{ target_user_gid }}"
    mode: "0755"

- name: Configure Zsh
  ansible.builtin.include_tasks: zsh.yml

- name: Configure Bash
  ansible.builtin.include_tasks: bash.yml

- name: Configure Pwsh
  ansible.builtin.include_tasks: pwsh.yml

- name: Configure Fonts
  ansible.builtin.include_tasks: fonts.yml

- name: Configure GnuPG
  ansible.builtin.include_tasks: gpg.yml

- name: Configure Git
  ansible.builtin.include_tasks: git.yml

- name: Configure Sway
  ansible.builtin.include_tasks: sway.yml

- name: Configure Mango
  ansible.builtin.include_tasks: mango.yml

- name: Configure Noctalia
  ansible.builtin.include_tasks: noctalia.yml

- name: Reload the user systemd manager
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ target_user }} --
      env XDG_RUNTIME_DIR=/run/user/{{ target_user_uid }}
      systemctl --user daemon-reload
  changed_when: true
