# ==== BINDING APPLICATION ====
# These file configures bindings for applications.

# Applications
bindsym $mod+k exec $term
bindsym $mod+f exec $browser
bindsym $mod+s exec $editor
bindsym $mod+e exec $fm

# Noctalia
bindsym $mod+space exec $ipc panel-toggle launcher
bindsym $mod+t exec $ipc panel-toggle wallpaper
bindsym $mod+l exec $ipc panel-toggle session
bindsym $kc-cross exec $ipc panel-toggle control-center