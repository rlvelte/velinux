# ==== BINDING WINDOW ====
# These file configures bindings for windows.

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
bind=SUPER,Return,togglefloating
bind=SUPER,Q,killclient
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
key_mode=resize
bind=NONE,Left,resizewin,-25,0
bind=NONE,Down,resizewin,0,-25
bind=NONE,Up,resizewin,0,+25
bind=NONE,Right,resizewin,+25,0
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default
bind=SUPER,R,setkeymode,default
key_mode=default
bind=SUPER,R,setkeymode,resize
bind=SUPER,Minus,minimized
bind=SUPER,Plus,toggle_scratchpad
