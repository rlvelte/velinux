# ==== BINDING WORKSPACE ====
# These file configures bindings for workspaces (tags in mango).

bind=SUPER+CTRL,Right,viewtoright
bind=SUPER+CTRL,Left,viewtoleft
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
