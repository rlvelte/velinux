# ==== SPECIAL KEYS ====
# These file configures bindings for special keys.

bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | swappy -f -
bindl=NONE,XF86AudioRaiseVolume,spawn,$ipc volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,$ipc volume-down
bindl=NONE,XF86AudioMute,spawn,$ipc volume-mute
bindl=NONE,XF86MonBrightnessUp,spawn,$ipc brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,$ipc brightness-down
