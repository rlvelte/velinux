---
- name: Install dependencies
  ansible.builtin.package:
    name: "{{ velinux_subl_dependencies }}"
    state: present
  when: velinux_subl_dependencies | length > 0

- name: Add the Sublime Text repository
  community.general.zypper_repository:
    name: sublime-text
    repo: "https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo"
    state: present
    autorefresh: true
    auto_import_keys: true

- name: Install packages
  ansible.builtin.package:
    name: "{{ velinux_subl_packages }}"
    state: present
  when: velinux_subl_packages | length > 0
