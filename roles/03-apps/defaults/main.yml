---
velinux_apps_repositories:
  - name: vivaldi
    description: "Vivaldi Browser"
    repo: "https://repo.vivaldi.com/archive/rpm/x86_64"
    gpgkey: "https://repo.vivaldi.com/archive/linux_signing_key.pub"
  - name: sublime
    description: "Sublime Text"
    repo: "https://download.sublimetext.com/rpm/stable/x86_64"
    gpgkey: "https://download.sublimetext.com/sublimehq-pub.gpg"
  - name: microsoft
    description: "Microsoft Production"
    repo: "https://packages.microsoft.com/opensuse/15/prod/"
  - name: librewolf
    description: "LibreWolf Browser"
    repo: "https://repo.librewolf.net"
    gpgkey: "https://repo.librewolf.net/pubkey.gpg"
  - name: vscodium
    description: "VSCodium"
    repo: "https://paulcarroty.gitlab.io/vscodium-deb-rpm-repo/rpms/"
    gpgkey: "https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg"
  - name: obs-rvelte
    description: "home:rvelte (openSUSE Tumbleweed)"
    repo: "https://download.opensuse.org/repositories/home:/rvelte/openSUSE_Tumbleweed/"

velinux_apps_dependencies:
  - curl
  - git
  - tar
  - libX11-6
  - libXext6
  - libXi6
  - libXtst6
  - libXrender1
  - libXss1
  - libxcb1
  - libxcb-keysyms1
  - libfontconfig1
  - libfreetype6
  - libxkbcommon0
  - Mesa-libGL1

velinux_apps_packages:
  - neovim
  - librewolf
  - sublime-text
  - distrobox
  - kitty
  - thunar
  - gimp
  - discord
  - obs-studio
  - steam
  - htop
  - vgn