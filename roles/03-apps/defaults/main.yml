---
velinux_apps_repositories:
  - name: vivaldi
    repo: "https://repo.vivaldi.com/archive/rpm/x86_64/vivaldi.repo"
  - name: sublime-text
    repo: "https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo"

velinux_apps_dependencies:
  - curl
  - git
  - tar
  - libX11-6
  - libXext6
  - libXi6
  - libXtst6
  - libXrender1
  - libXss1
  - libxcb1
  - libxcb-keysyms1
  - libfontconfig1
  - libfreetype6
  - libxkbcommon0
  - Mesa-libGL1

velinux_apps_packages:
  - neovim
  - vivaldi-stable
  - sublime-text
  - kitty
  - thunar
  - gimp
  - discord
  - obs-studio
  - steam
  - htop