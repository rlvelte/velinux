---
- name: Add system repositories
  community.general.zypper_repository:
    name: "{{ omit if item.repo.endswith('.repo') else item.name }}"
    repo: "{{ item.repo }}"
    state: present
    autorefresh: true
    auto_import_keys: true
  loop: "{{ velinux_system_repositories }}"

- name: Update kernel and firmware
  community.general.zypper:
    name:
      - kernel-default
      - kernel-firmware-all
    state: latest

- name: Install system dependencies
  ansible.builtin.package:
    name: "{{ velinux_system_dependencies }}"
    state: present
  when: velinux_system_dependencies | length > 0

- name: Install system packages
  ansible.builtin.package:
    name: "{{ velinux_system_packages }}"
    state: present

- name: Configure greetd
  ansible.builtin.import_tasks: greetd.yml

- name: Configure keyd
  ansible.builtin.import_tasks: keyd.yml

- name: Configure Cockpit
  ansible.builtin.import_tasks: cockpit.yml