---
- name: Install dependencies
  ansible.builtin.package:
    name: "{{ velinux_virt_dependencies }}"
    state: present
  when: velinux_virt_dependencies | length > 0

- name: Install packages
  ansible.builtin.package:
    name: "{{ velinux_virt_packages }}"
    state: present
  when: velinux_virt_packages | length > 0
