---
- name: Ensure the greeter system user exists
  ansible.builtin.user:
    name: greeter
    system: true
    home: /var/lib/greetd
    shell: /usr/sbin/nologin
    create_home: false

- name: Create greetd configuration directories
  ansible.builtin.file:
    path: "/etc/greetd/{{ greetd_item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ lookup('community.general.filetree', role_path + '/templates/greetd', wantlist=True) }}"
  loop_control:
    loop_var: greetd_item
  when: greetd_item.state == 'directory'

- name: Deploy greetd configuration files
  ansible.builtin.template:
    src: "{{ greetd_item.src }}"
    dest: "/etc/greetd/{{ greetd_item.path | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ lookup('community.general.filetree', role_path + '/templates/greetd', wantlist=True) }}"
  loop_control:
    loop_var: greetd_item
  when: greetd_item.state == 'file'
  notify: Restart greetd

- name: Enable greetd as the display manager
  ansible.builtin.systemd:
    name: greetd.service
    enabled: true
